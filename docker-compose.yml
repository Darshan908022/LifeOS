
services:
  db:
    image: postgres:16
    container_name: lifeos-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: lifeos
      POSTGRES_USER: lifeos_user
      POSTGRES_PASSWORD: lifeos_dev_password
    ports:
      - "5433:5432"
    volumes:
      - lifeos_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lifeos_user -d lifeos"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  lifeos_postgres_data:
